name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run unit tests
        working-directory: backend
        run: |
          # Run only unit tests that don't require MongoDB
          # Full integration tests (verify-phase*.sh) run separately in deployment
          pytest tests/test_auth.py tests/test_security_fixes.py tests/test_p2_hardening.py tests/test_p3_hardening.py -v --tb=short
          
  frontend-lint:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Run TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
        
      - name: Run i18n tests
        working-directory: frontend
        run: npm run test:i18n
        
  monitor-tests:
    name: Monitor Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          
      - name: Run tests
        working-directory: monitor
        run: go test -v ./...
