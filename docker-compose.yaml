name: grouproxy

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # The test host's MongoDB is an existing loopback-only service. Host
    # networking also preserves the monitor's existing 127.0.0.1:8000 URL.
    network_mode: host
    env_file:
      - path: ${GROUPROXY_BACKEND_ENV_FILE:-testenv/backend.env}
        required: true
    restart: unless-stopped
    environment:
      # Keep backup data outside the writable container layer. All other
      # application parameters come from the selected env_file unchanged.
      GROUPROXY_BACKUP_DIRECTORY: /var/lib/grouproxy/backups
    volumes:
      - grouproxy-backups:/var/lib/grouproxy/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        GROUPROXY_BACKEND_API_URL: ${GROUPROXY_BACKEND_API_URL:-http://host.docker.internal:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 80
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GROUPROXY_FRONTEND_PORT:-80}:80"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:80/healthz')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  grouproxy-backups:
