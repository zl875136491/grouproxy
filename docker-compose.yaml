name: grouproxy

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      GROUPROXY_ENVIRONMENT: ${GROUPROXY_ENVIRONMENT:-production}
      GROUPROXY_MONGODB_URL: ${GROUPROXY_MONGODB_URL:-mongodb://host.docker.internal:27017/?authSource=admin}
      GROUPROXY_MONGODB_DATABASE: ${GROUPROXY_MONGODB_DATABASE:-grouproxy}
      GROUPROXY_HOST: 0.0.0.0
      GROUPROXY_PORT: 8000
      GROUPROXY_BACKEND_PUBLIC_URL: ${GROUPROXY_BACKEND_PUBLIC_URL:-http://backend:8000}
      GROUPROXY_BUNDLE_HMAC_SECRET: ${GROUPROXY_BUNDLE_HMAC_SECRET:?Set GROUPROXY_BUNDLE_HMAC_SECRET to at least 32 characters}
      GROUPROXY_ADMIN_USERNAME: ${GROUPROXY_ADMIN_USERNAME:-zhangle}
      GROUPROXY_ADMIN_PASSWORD: ${GROUPROXY_ADMIN_PASSWORD:?Set GROUPROXY_ADMIN_PASSWORD to at least 12 characters}
      GROUPROXY_MANAGEMENT_TOKEN: ${GROUPROXY_MANAGEMENT_TOKEN:?Set GROUPROXY_MANAGEMENT_TOKEN to at least 32 characters}
      GROUPROXY_ALLOW_INSECURE_AGENT_HTTP: ${GROUPROXY_ALLOW_INSECURE_AGENT_HTTP:-true}
      GROUPROXY_SEED_DEFAULT_SITES: ${GROUPROXY_SEED_DEFAULT_SITES:-true}
      GROUPROXY_CORS_ALLOWED_ORIGINS: ${GROUPROXY_CORS_ALLOWED_ORIGINS:-}
      GROUPROXY_AUTH_SESSION_TTL_MINUTES: ${GROUPROXY_AUTH_SESSION_TTL_MINUTES:-43200}
      GROUPROXY_GQUAN_DELIVERY_MODE: ${GROUPROXY_GQUAN_DELIVERY_MODE:-app}
      GROUPROXY_GQUAN_APP_TOKEN: ${GROUPROXY_GQUAN_APP_TOKEN:-}
      GROUPROXY_BACKUP_DIRECTORY: /var/lib/grouproxy/backups
      GROUPROXY_BACKUP_AUTO_ENABLED: ${GROUPROXY_BACKUP_AUTO_ENABLED:-false}
      GROUPROXY_BACKUP_ENCRYPTION_KEY: ${GROUPROXY_BACKUP_ENCRYPTION_KEY:-}
    ports:
      - "${GROUPROXY_BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - grouproxy-backups:/var/lib/grouproxy/backups
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        GROUPROXY_BACKEND_API_URL: ${GROUPROXY_BACKEND_API_URL:-http://backend:8000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 80
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${GROUPROXY_FRONTEND_PORT:-80}:80"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:80/healthz')
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  grouproxy-backups:
